[catalog]
alias = "nucleus"

[tasks]
"qa:docs:links" = "effigy docs check links"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
]
# The lean Northstar spine: orientation, knowledge index, plan and release.
"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md docs/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/questions.md docs/knowledge/contracts/release.md"
"qa:northstar:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/knowledge/README.md'"
"qa:northstar:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:northstar:docs-front-door" = "effigy docs check contains docs/README.md --require 'knowledge/'"
"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:readme" },
  { task = "qa:northstar:docs-front-door" },
]
# Cheap orientation for `effigy doctor`. Full board is `effigy qa`.
# Never alias health to qa (or any aggregate that expands into the full suite).
health = [{ task = "qa:docs:agent-defaults" }]
setup = "npm ci"
"build:runtime" = "node scripts/build-runtime.mjs {args}"
"release:prepare" = "npm run release:prepare -- {args}"
"proof:installed-daemon" = "node scripts/proof-installed-daemon.mjs {args}"
"proof:t3code:heartbeat" = "node scripts/acceptance/t3code-heartbeat.mjs {args}"
"proof:t3code:read-sizes" = "node scripts/acceptance/t3code-read-sizes.mjs {args}"
# nucleus#1395's private proof: a card lost with its ACP turn is offered again on the
# next held turn, across a replaced callback socket, on a private nightly server.
"proof:t3code:reoffer" = "node --import tsx scripts/acceptance/t3code-reoffer-private.ts {args}"
# nucleus#1366's private snooze proof: the one row rule against the installed nightly.
"proof:t3code:inbox" = "node --import tsx scripts/acceptance/t3code-inbox-private.ts {args}"
# nucleus#1407's private proof: a settled inbox wake outside the bounded window (--expect blocked|woken).
"proof:t3code:window" = "node --import tsx scripts/acceptance/t3code-window-private.ts {args}"
"proof:t3code:snooze" = "node --import tsx scripts/acceptance/t3code-snooze-private.ts {args}"
# The BB host phase-0 spike: an isolated BB server, the reverse host-operation channel
# and the five-step lifecycle. Opt-in and private; refuses the live BB data directory.
"proof:bb" = "node --import tsx scripts/acceptance/bb-private.ts {args}"
# Spec 062 phase 5: the forked sidebar's own tests (the fork's runner) and the
# opt-in drift check. The drift check needs the network, so it is never in `check`.
"bb:sidebar-tests" = "npm run test:bb-sidebar -- {args}"
"bb:sidebar-drift" = "node scripts/bb/sidebar-drift.mjs {args}"
# Spec 062 phase 5's install proof: builds the plugin and installs it into the
# isolated BB server from phase 0 (never the operator's live BB).
"proof:bb:sidebar" = "node --import tsx scripts/acceptance/bb-sidebar-private.ts {args}"
# Spec 062 phase 6: bundle the shared board into the BB plugin package
# (react-native → react-native-web, React left to BB's runtime). Generated output.
"bb:board-build" = "node scripts/bb/build-board.mjs {args}"
check = [{ task = "check:types" }, { task = "check:plugin-types" }, { task = "check:publication" }]
# Test files a change can affect, from the import graph; `--run` runs them. See scripts/test-affected.mjs.
"test:affected" = "node scripts/test-affected.mjs {args}"
"test:baseline" = "node scripts/test-baseline.mjs {args}"
"check:types" = "npm run typecheck"
# The BB plugin package is its own program (Spec 062, decision 5a): the vendored
# sidebar and the registry modules it imports typecheck against the fork's own
# tsconfig, with the `@/*` mapping onto the plugin package root.
"check:plugin-types" = "tsc -p hosts/bb/plugin/tsconfig.json"
"check:publication" = "npm run publication:check"
"engine:fmt" = "cargo fmt --manifest-path engine/Cargo.toml --all -- --check"
"engine:board-build" = "node scripts/build-web.mjs {args}"
"engine:check" = "oxide check --manifest-path engine/Cargo.toml {args}"
"engine:clippy" = "oxide clippy --manifest-path engine/Cargo.toml --all-targets --all-features {args} -- -D warnings"
"engine:nextest" = "oxide exec --manifest-path engine/Cargo.toml -- cargo nextest run --manifest-path engine/Cargo.toml {args}"
"engine:stage" = "node scripts/stage-engine-release.mjs {args}"
# Proves a move PR changed no moved code; see scripts/check-moves.ts.
"check:moves" = "node --import tsx scripts/check-moves.ts {args}"
fmt = "node scripts/format-changed-typescript.mjs"
"fmt:check" = "node scripts/format-changed-typescript.mjs --check"
# Archived TypeScript timing oracles can still be run by explicit file.
"test:timing" = "npm run test:timing -- {args}"
# Fast checks first: a type or docs failure surfaces in seconds, not after the unit stage.
qa = [
  { task = "engine:fmt" },
  { task = "engine:check" },
  { task = "engine:clippy" },
  { task = "check" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
  { task = "engine:nextest" },
  { task = "test" },
]
# `--` preserves Effigy's passthrough; the runner places options before files.
[test.suites.unit]
run = "npm test --"

# Opt-in snapshot comparison: inert archived sources, no live provider or task execution.
[tasks."bench:service-hot-paths"]
run = "node scripts/bench-service-hot-paths.mjs"

# Private active git and supervisor probes; no live execution or store writes.
[tasks."bench:git-file-facts"]
run = "node scripts/bench-git-file-facts.mjs"
