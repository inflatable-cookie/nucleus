[package]
name = "nucleus-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "nucleus-desktop"

[lib]
name = "nucleus_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
longhorn-command = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-command-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-command-settings = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-bridge = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-core = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-display = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-surfaces = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-surfaces-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-native-content = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-operation = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-notifications = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-settings = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-settings-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-bridge = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-command = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-native-content-child-view = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-operation = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-notifications = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-settings = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-tauri-windowing = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-windowing = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
longhorn-windowing-config = { git = "ssh://git@github.com/inflatable-cookie/longhorn.git", tag = "v0.1.0" }
nucleus-command-policy = { path = "../../../crates/nucleus-command-policy" }
nucleus-core = { path = "../../../crates/nucleus-core" }
nucleus-engine = { path = "../../../crates/nucleus-engine" }
nucleus-local-store = { path = "../../../crates/nucleus-local-store" }
nucleus-projects = { path = "../../../crates/nucleus-projects" }
nucleus-server = { path = "../../../crates/nucleus-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
time = { version = "0.3", features = ["formatting"] }
tauri = { version = "2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
