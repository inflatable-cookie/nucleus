[workspace]
members = [
    "crates/nucleus-acp",
    "crates/nucleus-cli",
    "crates/nucleus-core",
    "crates/nucleus-forge",
    "crates/nucleus-hosts",
    "crates/nucleus-service",
    "crates/nucleus-store",
    "crates/nucleus-work",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
longhorn-config = { git = "https://github.com/inflatable-cookie/longhorn.git", rev = "049392e27f93d642839b82c28d217c1f353e569e" }
longhorn-core = { git = "https://github.com/inflatable-cookie/longhorn.git", rev = "049392e27f93d642839b82c28d217c1f353e569e" }
longhorn-git-workspace = { git = "https://github.com/inflatable-cookie/longhorn.git", rev = "049392e27f93d642839b82c28d217c1f353e569e" }
longhorn-redact = { git = "https://github.com/inflatable-cookie/longhorn.git", rev = "049392e27f93d642839b82c28d217c1f353e569e" }
longhorn-storage-layout = { git = "https://github.com/inflatable-cookie/longhorn.git", rev = "049392e27f93d642839b82c28d217c1f353e569e" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
