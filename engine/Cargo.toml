[workspace]
members = ["crates/nucleus-core", "crates/nucleus-store", "crates/nucleus-work"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
longhorn-config = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.5.0" }
longhorn-core = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.5.0" }
longhorn-git-workspace = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.5.0" }
longhorn-redact = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.5.0" }
longhorn-storage-layout = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.5.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
