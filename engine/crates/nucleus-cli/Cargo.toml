[package]
name = "nucleus-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nucleus-engine"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
nucleus-core = { path = "../nucleus-core" }
nucleus-forge = { path = "../nucleus-forge" }
nucleus-hosts = { path = "../nucleus-hosts" }
nucleus-service = { path = "../nucleus-service" }
nucleus-store = { path = "../nucleus-store" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
