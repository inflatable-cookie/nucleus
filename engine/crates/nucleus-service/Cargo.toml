[package]
name = "nucleus-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
log = "0.4"
longhorn-core.workspace = true
longhorn-credential-keyring.workspace = true
longhorn-git-workspace.workspace = true
longhorn-redact.workspace = true
nucleus-core = { path = "../nucleus-core" }
nucleus-forge = { path = "../nucleus-forge" }
nucleus-hosts = { path = "../nucleus-hosts" }
nucleus-store = { path = "../nucleus-store" }
nucleus-work = { path = "../nucleus-work" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rustix = { version = "1", features = ["fs", "process"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = "0.3.47"
toml = "0.9"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }

[dev-dependencies]
longhorn-git-workspace = { workspace = true, features = ["fixture-server"] }
axum = { version = "0.8.9", features = ["ws"] }
nucleus-acp = { path = "../nucleus-acp", features = ["loopback-fixture"] }
nucleus-forge = { path = "../nucleus-forge", features = ["loopback-fixture"] }
nucleus-hosts = { path = "../nucleus-hosts", features = ["loopback-fixture"] }
rusqlite = "0.41"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
