[package]
name = "nucleus-hosts"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
publish.workspace = true

[features]
loopback-fixture = []

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
longhorn-redact.workspace = true
log = { version = "0.4", features = ["max_level_debug"] }
nucleus-core = { path = "../nucleus-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
shlex = "2"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
