[package]
name = "nucleus-acp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
loopback-fixture = []

[dependencies]
getrandom = "0.3"
hex = "0.4"
nucleus-core = { path = "../nucleus-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
time = "0.3.47"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "test-util"] }

[lints]
workspace = true
