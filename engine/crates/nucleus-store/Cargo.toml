[package]
name = "nucleus-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
longhorn-config.workspace = true
longhorn-core.workspace = true
longhorn-storage-layout.workspace = true
nucleus-core = { path = "../nucleus-core" }
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[lints]
workspace = true
