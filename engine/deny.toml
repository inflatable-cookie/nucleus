[advisories]
# The all-target lock graph joins keyring's non-Apple Unix zbus edge with
# Longhorn's macOS/Windows-only keyring edge. Cargo trees for macOS, Windows
# and Linux contain none of these crates. Remove when Longhorn's keyring
# facade drops its zbus 5 dependency or updates to the merged zbus 6 crates.
# cargo-deny 0.19.4 only accepts an advisory ID and reason. Recheck the
# separate target graphs if any of these locked versions change.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.9.2 only appears in the all-target keyring union" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.1 only appears in the all-target keyring union" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.9.2 only appears in the all-target keyring union" },
]

[bans]
# Transitive consumers still require different versions of some crates.
multiple-versions = "warn"
wildcards = "deny"
# Unpublished members use sibling paths and tagged Longhorn dependencies.
allow-wildcard-paths = true

[licenses]
include-dev = true
# The engine's publish = false workspace members carry no SPDX metadata.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# rustls-platform-verifier uses this package's Mozilla root certificate data.
# https://github.com/rustls/webpki-roots/tree/main/webpki-root-certs
exceptions = [
  { crate = "webpki-root-certs@=1.0.12", allow = ["CDLA-Permissive-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"
allow-git = ["https://github.com/inflatable-cookie/longhorn.git"]
